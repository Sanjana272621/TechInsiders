<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curio - AI Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex">
    
    <!-- Sidebar -->
    <div class="w-1/5 bg-white shadow-md p-6 
    flex flex-col items-center">
        <div class="w-20 h-20 bg-gray-300 rounded-full mb-4"></div>
        <nav class="w-full">
            <ul class="space-y-4">
                <li class="p-2 text-lg font-semibold hover:bg-gray-200 cursor-pointer">Home</li>
                <li class="p-2 text-lg font-semibold hover:bg-gray-200 cursor-pointer">Progress</li>
                <li class="p-2 text-lg font-semibold hover:bg-gray-200 cursor-pointer">Your History</li>
                <li class="p-2 text-lg font-semibold hover:bg-gray-200 cursor-pointer">About Curio</li>
            </ul>
        </nav>
    </div>
    
    <!-- Main Content -->
    <div class="flex-1 p-10">
        <h1 class="text-3xl font-bold text-center">Curio - Where curiosity meets technology for smarter learning</h1>
        
        <div class="bg-white shadow-md p-6 mt-6">
            <p class="text-lg">Some text.</p>
        </div>
        
        <!-- File Upload Section -->
        <div class="mt-6">
            <p class="text-xl font-semibold">Upload or drag and drop a video file</p>
            <label for="file-upload" class="mt-4 block border-2 border-dashed border-gray-400 p-10 rounded-lg cursor-pointer flex flex-col items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16v-2a4 4 0 014-4h10a4 4 0 014 4v2M16 12l-4-4m0 0l-4 4m4-4v12" />
                </svg>
                <span class="text-gray-600">Click to upload or drag and drop</span>
                <input id="file-upload" type="file" class="hidden" />
            </label>
        </div>
    </div>
</body>
</html>
